<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Family Finance</title>
        <!-- viewport-fit=cover lets the page use the full screen and exposes env(safe-area-inset-*) -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <style>
            *, *::before, *::after { box-sizing: border-box; }
            html, body, #main {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            body {
                background: #f5f5f5;
                font-family: system-ui, -apple-system, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
                overscroll-behavior: none;
                -webkit-text-size-adjust: 100%;
                -webkit-tap-highlight-color: transparent;
            }
        </style>
    </head>
    <body>
        <div id="main"></div>
    </body>
</html>
