[package]
name = "family-finance"
version = "1.0.0"
authors = ["Nam Dinh <namdwb@gmail.com>"]
edition = "2021"

[[bin]]
name = "family-finance"
path = "src/main.rs"
 
[dependencies]
dioxus        = { version = "0.7.10", features = ["mobile"] }
rusqlite      = { version = "0.31", features = ["bundled"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
uuid          = { version = "1", features = ["v4"] }
chrono        = { version = "0.4", features = ["serde"] }
rust_decimal  = { version = "1", features = ["serde-float"] }
once_cell     = "1"
thiserror     = "1"
time          = "=0.3.36"
bcrypt        = "0.15"
# Exchange-rate fetching: rustls (no OpenSSL) so it cross-compiles for iOS/Android
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio         = { version = "1", features = ["time"] }
# ID card photos: base64 to/from the WebView and inside backup JSON
base64        = "0.22"
 
# Local (system) notifications for reminders
[target.'cfg(target_os = "ios")'.dependencies]
objc2                    = "0.6"
block2                   = "0.6"
objc2-foundation         = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSSet"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "UNNotification", "UNNotificationResponse", "UNNotificationAction", "UNNotificationCategory", "block2"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = 3
lto       = true
strip     = true

[features]
default = ["mobile"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
